# Países reconhecidos nas notícias, separados em grupos.
#
# Os temas (temas.yaml) dizem quais grupos/países são permitidos. Uma notícia
# que cita SÓ países fora da lista permitida é removida. Notícia que não cita
# nenhum país (ex: "Ri Happy pede recuperação extrajudicial") é mantida.
#
# Para mudar um país de grupo, troque o `grupo`. Para um país novo, copie uma
# linha. `nomes` segue as mesmas regras das palavras-chave dos temas
# (acentos/maiúsculas não importam, * aceita qualquer final).

paises:
  # ---------------- G10 (+ Austrália, Nova Zelândia, Noruega, Espanha) ----------------
