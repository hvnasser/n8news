name: Listar modelos OpenRouter (temporário)
on:
  push:
    paths: [".github/workflows/listar-modelos.yml"]
jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS https://openrouter.ai/api/v1/models > m.json
          python3 - <<'PY'
          import json
          d = json.load(open("m.json"))["data"]
          print("TOTAL", len(d))
          for m in sorted(d, key=lambda m: m["id"]):
              i = m["id"]
              if i.split("/")[0] in ("anthropic", "openai", "google", "deepseek", "mistralai", "x-ai", "qwen", "meta-llama"):
                  p = m["pricing"]
                  sp = m.get("supported_parameters") or []
                  print(f'{i} | in={float(p["prompt"])*1e6:.2f} out={float(p["completion"])*1e6:.2f} | ' +
                        ("SO " if "structured_outputs" in sp else "") + ("RF " if "response_format" in sp else "") +
                        ("REASON" if "reasoning" in sp else ""))
          PY
