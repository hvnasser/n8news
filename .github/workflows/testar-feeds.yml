name: Testar feeds (temporário)
on:
  push:
    paths: ["feeds-teste.yaml", ".github/workflows/testar-feeds.yml"]
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m n8news --config feeds-teste.yaml || true
