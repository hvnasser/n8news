name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    # Todo dia às 06:50 de Brasília (09:50 UTC). O GitHub pode atrasar alguns
    # minutos. Só funciona depois que este arquivo estiver no branch principal.
    - cron: "50 9 * * *"
  push:
    paths:
      - "n8news/**"
      - "feeds.yaml"
      - "temas.yaml"
      - "paises.yaml"
      - "tests/**"
      - ".github/workflows/buscar-noticias.yml"

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Testes
        run: python -m pytest -q
      - name: Buscar notícias
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          # E-mail só no horário agendado ou rodando manualmente (não a cada push).
          # TEMPORÁRIO: ligado em todo push para o primeiro teste.
          ENVIAR: "--enviar-email"
        run: python -m n8news --json noticias.json --salvar-email email.html $ENVIAR
      - uses: actions/upload-artifact@v4
        with:
          name: noticias
          path: |
            noticias.json
            email.html
