name: Buscar notícias

on:
  workflow_dispatch:
  schedule:
    # Horários de Brasília (o GitHub usa UTC e pode atrasar alguns minutos).
    # Só funciona com este arquivo no branch principal do repositório.
    # De 3 em 3 horas: 00:50, 03:50, 06:50, 09:50, 12:50, 15:50, 18:50, 21:50
    - cron: "50 */3 * * *"
  push:
    paths:
      - "n8news/**"
      - "feeds.yaml"
      - "temas.yaml"
      - "paises.yaml"
      - "tests/**"
      - ".github/workflows/buscar-noticias.yml"

# Uma execução por vez (evita duas atualizando o painel ao mesmo tempo)
concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Testes
        run: python -m pytest -q
      - name: Buscar notícias e gerar o painel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          # E-mail desligado. Para voltar a receber por e-mail, crie a variável
          # ENVIAR_EMAIL = true em Settings → Secrets and variables → Actions →
          # Variables (e os secrets do Gmail). Só envia nos horários agendados
          # ou rodando manualmente, nunca a cada mudança no código.
          ENVIAR: ${{ vars.ENVIAR_EMAIL == 'true' && github.event_name != 'push' && '--enviar-email' || '' }}
        run: python -m n8news --json noticias.json --painel site --salvar-email email.html $ENVIAR
      - uses: actions/upload-artifact@v4
        with:
          name: noticias
          path: |
            noticias.json
            email.html
            site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    # Publica o painel no GitHub Pages (só a partir do branch principal)
    needs: buscar
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
